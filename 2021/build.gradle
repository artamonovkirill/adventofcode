plugins {
    id 'groovy'
}

dependencies {
    implementation 'org.apache.groovy:groovy:6.0.0'
    testImplementation 'org.spockframework:spock-core:2.5-groovy-6.0'
    testImplementation 'org.junit.platform:junit-platform-launcher:6.1.3'
}

repositories {
    mavenCentral()
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
    }
}
